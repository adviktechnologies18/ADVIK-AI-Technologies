<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1c2e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b6fc9"/>
      <stop offset="100%" stop-color="#5ac8e8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="20" fill="url(#bg2)"/>

  <!-- Glowing Outer Rings -->
  <circle cx="400" cy="300" r="220" fill="none" stroke="rgba(90,200,232,0.15)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="400" cy="300" r="160" fill="none" stroke="rgba(59,111,201,0.25)" stroke-width="2"/>

  <!-- Core Shield / Globe -->
  <circle cx="400" cy="300" r="90" fill="#1b2430" stroke="url(#blueG)" stroke-width="3"/>

  <!-- Mail Icon Inside Center -->
  <path d="M360 280 L400 310 L440 280 M360 280 H440 V320 C440 325 435 330 430 330 H370 C365 330 360 325 360 320 Z" fill="none" stroke="#5ac8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Surrounding Service Orbits -->
  <!-- Top Node: Web -->
  <g transform="translate(400, 140)">
    <circle cx="0" cy="0" r="32" fill="#0d1f38" stroke="#3b6fc9" stroke-width="2"/>
    <text x="-12" y="8" font-family="sans-serif" font-size="22">🌐</text>
  </g>
  
  <!-- Right Node: AI -->
  <g transform="translate(560, 300)">
    <circle cx="0" cy="0" r="32" fill="#0d1f38" stroke="#5ac8e8" stroke-width="2"/>
    <text x="-12" y="8" font-family="sans-serif" font-size="22">🤖</text>
  </g>

  <!-- Bottom Node: WhatsApp/Chat -->
  <g transform="translate(400, 460)">
    <circle cx="0" cy="0" r="32" fill="#0d1f38" stroke="#3b6fc9" stroke-width="2"/>
    <text x="-12" y="8" font-family="sans-serif" font-size="22">💬</text>
  </g>

  <!-- Left Node: Growth -->
  <g transform="translate(240, 300)">
    <circle cx="0" cy="0" r="32" fill="#0d1f38" stroke="#5ac8e8" stroke-width="2"/>
    <text x="-12" y="8" font-family="sans-serif" font-size="22">🚀</text>
  </g>

  <!-- Connectors -->
  <line x1="400" y1="172" x2="400" y2="210" stroke="#3b6fc9" stroke-width="2"/>
  <line x1="528" y1="300" x2="490" y2="300" stroke="#5ac8e8" stroke-width="2"/>
  <line x1="400" y1="428" x2="400" y2="390" stroke="#3b6fc9" stroke-width="2"/>
  <line x1="272" y1="300" x2="310" y2="300" stroke="#5ac8e8" stroke-width="2"/>

  <text x="400" y="530" font-family="sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">ADVIK AI TECHNOLOGIES</text>
  <text x="400" y="552" font-family="sans-serif" font-size="13" fill="#5ac8e8" text-anchor="middle">Connecting Your Business to the Future</text>
</svg>
